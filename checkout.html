<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ModernShop</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Simple Header for Checkout -->
    <div class="navbar">
        <div class="container flex justify-between items-center" style="height: 100%;">
            <a href="index.html" class="logo">ModernShop.</a>
            <div class="secure-badge"
                style="display: flex; align-items: center; gap: 0.5rem; color: var(--secondary-color);">
                <i class="fa-solid fa-lock"></i> Secure Checkout
            </div>
        </div>
    </div>

    <div class="container flex" style="gap: 3rem; margin: 3rem auto; flex-wrap: wrap;">

        <!-- Checkout Form -->
        <div style="flex: 2; min-width: 350px;">
            <h2 class="mb-4" style="font-size: 1.5rem;">Shipping Information</h2>

            <form id="checkout-form"
                onsubmit="event.preventDefault(); alert('Order Placed Successfully!'); localStorage.removeItem('shopCart'); window.location.href='index.html';">
                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div>
                        <label class="block mb-2 text-sm font-medium">First Name</label>
                        <input type="text" required
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium">Last Name</label>
                        <input type="text" required
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block mb-2 text-sm font-medium">Email Address</label>
                    <input type="email" required
                        style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                </div>

                <div class="mb-4">
                    <label class="block mb-2 text-sm font-medium">Street Address</label>
                    <input type="text" required
                        style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                </div>

                <div class="grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                    <div>
                        <label class="block mb-2 text-sm font-medium">City</label>
                        <input type="text" required
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium">State</label>
                        <input type="text" required
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium">Zip Code</label>
                        <input type="text" required
                            style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                    </div>
                </div>

                <h2 class="mb-4" style="font-size: 1.5rem;">Payment Method</h2>
                <div class="mb-4 flex" style="gap: 1rem;">
                    <label
                        style="border: 1px solid var(--border-color); padding: 1rem; border-radius: 0.5rem; flex: 1; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="payment" checked>
                        <span><i class="fa-regular fa-credit-card"></i> Credit Card</span>
                    </label>
                    <label
                        style="border: 1px solid var(--border-color); padding: 1rem; border-radius: 0.5rem; flex: 1; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="payment">
                        <span><i class="fa-brands fa-paypal"></i> PayPal</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; font-size: 1.1rem; padding: 1rem;">Place Order</button>
            </form>
        </div>

        <!-- Checkout Summary -->
        <div style="flex: 1; min-width: 280px; background: #f9fafb; padding: 2rem; border-radius: 1rem;">
            <h3 class="mb-4" style="font-size: 1.25rem; font-weight: 600;">Order Summary</h3>
            <div id="checkout-items">
                <!-- Items list -->
                <p style="color: var(--text-light); font-size: 0.875rem;">Loading...</p>
            </div>
            <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                <div class="flex justify-between mb-2">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">$0.00</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="flex justify-between" style="font-weight: 700; font-size: 1.1rem; margin-top: 0.5rem;">
                    <span>Total</span>
                    <span id="checkout-total">$0.00</span>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
        // Simple inline script to populate checkout summary from localStorage if needed immediately
        // but app.js will handle it.
    </script>
</body>

</html>
